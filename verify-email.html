<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email — TruthLens</title><link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <style>
    *{box-sizing:border-box}:root{--ink:#111827;--muted:#667085;--line:#e6e8ee;--paper:#fff}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8faff,#f3f7f5);position:relative;overflow-x:hidden}.bg-blob{position:fixed;border-radius:999px;filter:blur(8px);opacity:.55;pointer-events:none}.blob-1{width:340px;height:340px;background:#e8edff;top:-160px;right:-90px}.blob-2{width:300px;height:300px;background:#e9f8ef;bottom:-130px;left:-100px}.blob-3{width:190px;height:190px;background:#f5edff;top:42%;left:45%;opacity:.25}
    .navbar{height:76px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border-bottom:1px solid rgba(230,232,238,.8)}.logo{color:var(--ink);text-decoration:none;font-weight:850;font-size:1.1rem}
    .auth-page{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:48px 18px}.auth-card{width:min(470px,100%);background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:28px;padding:42px;box-shadow:0 28px 80px rgba(17,24,39,.12);text-align:center}.verify-icon{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 22px;background:#f0f3ff;font-size:1.9rem}.auth-card h2{font-size:2rem;letter-spacing:-.04em;margin:0 0 12px}.auth-subtitle{color:var(--muted);line-height:1.7;font-size:.94rem;margin:0 0 28px}.auth-subtitle strong{color:#111827;overflow-wrap:anywhere}.btn-primary,.btn-secondary{width:100%;border:0;border-radius:13px;padding:14px 16px;font-weight:750;font-size:.92rem;cursor:pointer}.btn-primary{background:#111827;color:#fff}.btn-secondary{background:#f5f6f8;color:#111827;border:1px solid #e2e5ea}.btn-primary:hover,.btn-secondary:hover{transform:translateY(-1px)}.form-message{min-height:22px;color:#667085;font-size:.85rem;margin:18px 0 0}.auth-footer-text{margin:26px 0 0;color:var(--muted);font-size:.86rem}.auth-footer-text a{color:#111827;font-weight:750;text-decoration:none}.security-note{margin-top:28px;padding:12px 14px;background:#fafafa;border:1px solid #eceef2;border-radius:12px;color:#7b8492;font-size:.75rem;line-height:1.5}@media(max-width:520px){.auth-card{padding:32px 22px;border-radius:22px}.auth-card h2{font-size:1.7rem}}
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>
  <nav class="navbar"><a href="index.html" class="logo">🔎 TruthLens</a>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
    🌙
</button></nav>
  <main class="auth-page"><div class="auth-card">
    <div class="verify-icon">✉️</div><h2>Check your inbox</h2>
    <p class="auth-subtitle">We sent a verification link to <strong id="userEmail">your email</strong>. Click it to verify your account, then come back here.</p>
    <button id="continueBtn" class="btn-primary btn-full">I've verified — Continue</button>
    <button id="resendBtn" class="btn-secondary btn-full" style="margin-top:12px;">Resend verification email</button>
    <p id="formMessage" class="form-message"></p>
    <p class="auth-footer-text">Wrong account? <a href="login.html">Go back to Login</a></p>
    <div class="security-note">🔐 Email verification helps keep your TruthLens account secure.</div>
  </div></main>
  <script type="module" src="js/firebase-config.js"></script><script type="module" src="js/auth.js"></script>
</body></html>
