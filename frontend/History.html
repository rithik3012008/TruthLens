<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — TruthLens</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <style>
    :root{--ink:#111827;--muted:#667085;--line:#e7e9ee;--paper:#fff;--soft:#f7f8fb;--accent:#111827;--shadow:0 24px 70px rgba(17,24,39,.10);--radius:24px}
    *{box-sizing:border-box} body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#fbfcff,#f3f5f9);min-height:100vh}
    .tl-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}.tl-bg:before,.tl-bg:after{content:"";position:absolute;border-radius:999px;filter:blur(3px);opacity:.55}.tl-bg:before{width:360px;height:360px;background:#e8edff;top:-150px;right:-90px}.tl-bg:after{width:300px;height:300px;background:#edf9f2;bottom:-120px;left:-100px}
    .navbar{height:76px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);border-bottom:1px solid rgba(231,233,238,.8);position:sticky;top:0;z-index:5}.logo{font-weight:800;text-decoration:none;color:var(--ink);font-size:1.1rem}.nav-links{display:flex;gap:24px;align-items:center}.nav-links a{color:#475467;text-decoration:none;font-weight:650;font-size:.9rem}.nav-links a:hover{color:#111827}
    .dashboard{max-width:1120px;margin:0 auto;padding:64px 24px 80px}.dashboard-header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.dashboard-header h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;letter-spacing:-.045em;margin:0 0 10px}.dashboard-subtitle{color:var(--muted);margin:0;font-size:1rem}.history-top{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:16px}.history-top strong{display:block;font-size:1rem}.history-top span{color:var(--muted);font-size:.85rem}.history-cta{display:inline-flex;text-decoration:none;padding:11px 16px;border-radius:12px;background:#111827;color:#fff;font-weight:750;font-size:.85rem;white-space:nowrap}.history-cta:hover{transform:translateY(-1px)}
    #historyList{display:grid;gap:14px}.history-item,.history-card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:0 12px 35px rgba(17,24,39,.055);transition:.2s}.history-item:hover,.history-card:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(17,24,39,.09)}
    #emptyMessage{background:#fff;border:1px dashed #d7dbe4;border-radius:20px;padding:46px 24px!important;color:var(--muted)!important;margin:18px 0 0!important}.empty-icon{font-size:2rem;margin-bottom:10px}.empty-link{color:#111827;font-weight:750}
    @media(max-width:700px){.navbar{height:auto;min-height:68px;gap:14px}.nav-links{gap:12px}.nav-links a{font-size:.78rem}.dashboard{padding:40px 16px 60px}.dashboard-header{display:block}.history-top{align-items:flex-start;flex-direction:column}.history-cta{width:100%;justify-content:center}}
  
/* History verification cards */
.history-item-card {
  margin-bottom: 16px;
  padding: 22px 24px;
  border: 1px solid rgba(15, 23, 42, 0.08);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.history-item-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
}

.history-item-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
}

.history-item-content {
  min-width: 0;
  flex: 1;
}

.history-item-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 9px;
  color: #64748b;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.history-item-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  display: inline-block;
}

.dot-fake { background: #ef4444; }
.dot-real { background: #22c55e; }

.history-item-text {
  margin: 0;
  color: #172033;
  font-size: 0.98rem;
  line-height: 1.65;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.history-result-badge {
  flex: 0 0 116px;
  min-height: 82px;
  padding: 11px 12px;
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  text-align: center;
  border: 1px solid transparent;
}

.history-badge-fake {
  background: #fff1f2;
  border-color: #fecdd3;
  color: #be123c;
}

.history-badge-real {
  background: #f0fdf4;
  border-color: #bbf7d0;
  color: #15803d;
}

.history-result-icon {
  font-size: 0.8rem;
  line-height: 1;
  margin-bottom: 2px;
}

.history-result-prediction {
  font-size: 0.8rem;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.history-result-confidence {
  font-size: 1.08rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.history-item-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  padding-top: 13px;
  border-top: 1px solid rgba(15, 23, 42, 0.07);
  color: #94a3b8;
  font-size: 0.76rem;
}

.history-analysis {
  font-weight: 700;
  color: #64748b;
}

@media (max-width: 640px) {
  .history-item-card {
    padding: 18px;
  }

  .history-item-main {
    align-items: flex-start;
    gap: 16px;
  }

  .history-result-badge {
    flex-basis: 92px;
    min-height: 72px;
    border-radius: 13px;
  }

  .history-result-confidence {
    font-size: 0.95rem;
  }

  .history-item-text {
    font-size: 0.9rem;
  }

  .history-item-footer {
    align-items: flex-start;
    flex-direction: column;
    gap: 6px;
  }
}

</style>
</head>
<body data-protected="true">
  <div class="tl-bg"></div>
  <nav class="navbar">
    <a href="dashboard.html" class="logo">🔎 TruthLens</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
    🌙
</button>
    <div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="detector.html">Detector</a><a href="#" id="logoutBtn">Logout</a></div>
  </nav>
  <main class="dashboard">
    <div class="dashboard-header"><div><h1>Your Check History</h1><p class="dashboard-subtitle">A quick look at your recent TruthLens verification activity.</p></div></div>
    <div class="history-top"><div><strong>Recent verifications</strong><span>Your most recent 20 news checks appear here.</span></div><a class="history-cta" href="detector.html">+ Verify something</a></div>
    <div id="historyList"></div>
    <p id="emptyMessage" class="hidden">🔎<br><strong>No checks yet</strong><br>Start with a headline, article, link, or screenshot. <a class="empty-link" href="detector.html">Open the detector →</a></p>
  </main>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/history-page.js"></script>
</body>
</html>
