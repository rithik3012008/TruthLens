<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — TruthLens</title><link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <style>
    *{box-sizing:border-box}:root{--ink:#111827;--muted:#667085;--line:#e6e8ee}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8faff,#f4f7fb);overflow-x:hidden}.bg-blob{position:fixed;border-radius:999px;filter:blur(8px);opacity:.55;pointer-events:none}.blob-1{width:350px;height:350px;background:#e8edff;top:-170px;right:-100px}.blob-2{width:310px;height:310px;background:#edf8f1;bottom:-140px;left:-110px}.blob-3{width:180px;height:180px;background:#f5edff;top:38%;left:45%;opacity:.25}
    .navbar{height:76px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border-bottom:1px solid rgba(230,232,238,.8)}.logo{color:var(--ink);text-decoration:none;font-weight:850;font-size:1.1rem}
    .auth-page{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:48px 18px}.auth-card{width:min(470px,100%);background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:28px;padding:42px;box-shadow:0 28px 80px rgba(17,24,39,.12)}.reset-icon{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;background:#f0f3ff;font-size:1.9rem;margin-bottom:22px}.auth-card h2{font-size:2rem;letter-spacing:-.04em;margin:0 0 10px}.auth-subtitle{color:var(--muted);line-height:1.65;font-size:.94rem;margin:0 0 28px}.auth-card label{display:block;font-size:.82rem;font-weight:750;margin:0 0 8px}.auth-card input{width:100%;border:1px solid #dfe3ea;border-radius:13px;padding:14px 15px;font:inherit;font-size:.92rem;outline:none;margin-bottom:16px;background:#fff}.auth-card input:focus{border-color:#9aa4b2;box-shadow:0 0 0 4px rgba(17,24,39,.06)}.btn-primary{width:100%;border:0;border-radius:13px;padding:14px 16px;background:#111827;color:#fff;font-weight:750;font-size:.92rem;cursor:pointer}.btn-primary:hover{transform:translateY(-1px)}.form-message{min-height:22px;color:#667085;font-size:.85rem;margin:16px 0 0}.auth-footer-text{margin:25px 0 0;text-align:center;color:var(--muted);font-size:.86rem}.auth-footer-text a{color:#111827;font-weight:750;text-decoration:none}.security-note{margin-top:26px;padding:12px 14px;background:#fafafa;border:1px solid #eceef2;border-radius:12px;color:#7b8492;font-size:.75rem;line-height:1.5;text-align:center}@media(max-width:520px){.auth-card{padding:32px 22px;border-radius:22px}.auth-card h2{font-size:1.7rem}}
  </style>
</head>
<body>
  <div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>
  <nav class="navbar"><a href="index.html" class="logo">🔎 TruthLens</a></nav>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
    🌙
</button>
  <main class="auth-page"><div class="auth-card">
    <div class="reset-icon">🔑</div><h2>Reset your password</h2>
    <p class="auth-subtitle">No stress. Enter the email linked to your TruthLens account and we'll send you a secure reset link.</p>
    <form id="forgotPasswordForm"><label for="email">Email address</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email" required><button type="submit" class="btn-primary btn-full">Send Reset Link</button><p id="formMessage" class="form-message"></p></form>
    <p class="auth-footer-text">Remembered your password? <a href="login.html">Back to Login</a></p>
    <div class="security-note">🔐 Never share your password or reset link with anyone.</div>
  </div></main>
  <script type="module" src="js/firebase-config.js"></script><script type="module" src="js/auth.js"></script>
</body></html>
